# Production Docker Compose Override
# Use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # PostgreSQL Database for Production
  postgres:
    image: postgres:13-alpine
    container_name: leave-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leave_system}
      POSTGRES_USER: ${POSTGRES_USER:-leave_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - leave-system-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leave_user} -d ${POSTGRES_DB:-leave_system}"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # Web application with production settings
  web:
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-leave_user}:${POSTGRES_PASSWORD:-secure_password_change_me}@postgres:5432/${POSTGRES_DB:-leave_system}
      - SECURE_SSL_REDIRECT=True
      - SECURE_HSTS_SECONDS=31536000
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # Redis for session storage and caching (optional)
  redis:
    image: redis:6-alpine
    container_name: leave-system-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password_change_me}
    volumes:
      - redis_data:/data
    networks:
      - leave-system-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # Nginx with SSL termination
  nginx:
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ./data/static:/var/www/static:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    environment:
      - NGINX_HOST=${DOMAIN_NAME:-localhost}
    profiles:
      - production
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  # Let's Encrypt SSL certificate management
  certbot:
    image: certbot/certbot
    container_name: leave-system-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL:-admin@example.com} --agree-tos --no-eff-email -d ${DOMAIN_NAME:-localhost}
    profiles:
      - ssl
    depends_on:
      - nginx

  # Database backup service (enhanced for production)
  db-backup:
    image: postgres:13-alpine
    container_name: leave-system-db-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: |
      sh -c "
        while true; do
          echo 'Creating PostgreSQL backup...'
          timestamp=$$(date +%Y%m%d_%H%M%S)
          pg_dump -h postgres -U ${POSTGRES_USER:-leave_user} -d ${POSTGRES_DB:-leave_system} > /backups/postgres_backup_$$timestamp.sql
          echo 'Backup created: postgres_backup_$$timestamp.sql'
          # Compress old backups
          find /backups -name '*.sql' -mtime +1 -exec gzip {} \;
          # Keep only last 30 days of backups
          find /backups -name '*.sql.gz' -mtime +30 -delete
          sleep 86400  # Backup every 24 hours
        done
      "
    networks:
      - leave-system-network
    depends_on:
      postgres:
        condition: service_healthy

  # Application monitoring (optional)
  watchtower:
    image: containrrr/watchtower
    container_name: leave-system-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400  # Check for updates daily
      - WATCHTOWER_INCLUDE_STOPPED=true
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local

networks:
  leave-system-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16